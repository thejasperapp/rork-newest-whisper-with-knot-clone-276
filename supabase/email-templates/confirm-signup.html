<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#f5f5f4;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;">
    <div style="max-width:480px;margin:0 auto;padding:32px 16px;">
      <div style="text-align:center;padding-bottom:20px;">
        <span style="font-size:22px;font-weight:800;letter-spacing:-0.5px;color:#111;">whisper</span>
      </div>
      <div style="background:#ffffff;border:1px solid #e7e5e4;border-radius:20px;padding:32px 28px;">
        <h1 style="margin:0 0 14px;font-size:21px;font-weight:800;color:#111;">Welcome to Whisper</h1>
        <p style="margin:0 0 14px;font-size:15px;line-height:1.65;color:#44403c;">
          You're one tap away from your crew. Confirm your email to activate your
          account and start sharing notes, stories, and messages.
        </p>
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#111;color:#fff;text-decoration:none;font-weight:700;font-size:15px;padding:13px 28px;border-radius:999px;margin-top:6px;">Confirm my email</a>
        <p style="margin:20px 0 0;font-size:13px;line-height:1.6;color:#a8a29e;">
          If you didn't create a Whisper account, you can safely ignore this email.
        </p>
      </div>
      <p style="text-align:center;color:#a8a29e;font-size:12px;line-height:1.6;margin-top:20px;">
        Whisper · <a href="https://mydailywhisper.com" style="color:#a8a29e;">mydailywhisper.com</a>
      </p>
    </div>
  </body>
</html>
